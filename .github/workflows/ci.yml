name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    name: Validate pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # lupa embeds the Lua interpreter the syntax gate compiles the recovered
      # modules with. Without it the gate exits 2 and the run cannot tell
      # "the recovered Lua does not compile" from "the checker is missing its
      # interpreter", which is a useless diagnostic.
      - name: Install the Lua interpreter for the syntax gate
        run: python -m pip install --disable-pip-version-check "lupa>=2.0"

      # The extracted payloads are gitignored, so this validates the committed
      # pipeline: it parses, the decompiler driver compiles, the argument
      # guards refuse bad input, and the docs point at files that exist.
      - name: Run pipeline checks
        run: bash tools/ci-checks.sh
